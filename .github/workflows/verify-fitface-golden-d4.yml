name: Verify FitFace Golden D4

on:
  push:
    branches: [work/fitface-four-style-golden]
    paths:
      - 'fitface-layout-golden/GoldenD4*.kt'
      - 'fitface-layout-golden/Samsung00049GoldenD4*.kt'
      - 'fitface-layout-golden/apply_golden_d4*.py'
      - 'fitface-layout-golden/golden_d4_*'
      - '.github/workflows/verify-fitface-golden-d4.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  d4-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper tree
        uses: actions/checkout@v4
        with:
          ref: work/fitface-four-style-golden
          path: helper
      - name: Check out pinned upstream
        uses: actions/checkout@v4
        with:
          repository: satvikgosai/fitface-studio
          ref: 45a9788d3877627fd5301e9ebba36ef6192d7962
          path: fitface-studio
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish D4 pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"fitface-golden-d4\",\"description\":\"D4 compiler contract running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - name: Apply locked Foundation and D1 D2 D3 stack
        shell: bash
        run: |
          set -euo pipefail
          python3 helper/fitface-build/run_manifest.py helper/fitface-build/v12-foundation-manifest.json --helper-root helper --check
          python3 helper/fitface-build/run_manifest.py helper/fitface-build/v12-foundation-manifest.json --helper-root helper --target-root fitface-studio
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/Samsung00003ClockOpticalCompensationTest.kt')
          t=p.read_text(); a='    @Test\n    fun style3ForegroundUsesUnifiedPerceptualMidpointCalibration() {'
          if t.count(a)!=1: raise SystemExit('v10 anchor drift')
          p.write_text(t.replace(a,'    @org.junit.Ignore("superseded by v11")\n'+a,1))
          PY
          python3 helper/fitface-layout-golden/apply_golden_format_patch.py fitface-studio
          python3 helper/fitface-layout-golden/apply_golden_optical_support.py fitface-studio
          for production in GoldenAmPmLocaleEditor.kt GoldenSemanticCompiler.kt GoldenWeatherIconCompiler.kt GoldenDateCompiler.kt GoldenWeatherTextEditor.kt GoldenD1Compiler.kt GoldenD1OpticalLock.kt GoldenD1HardwareCorrections.kt GoldenHardwareBaseline.kt GoldenD2Compiler.kt GoldenD2LayoutCompiler.kt GoldenD2HardwareBaseline.kt GoldenD3Compiler.kt; do
            cp "helper/fitface-layout-golden/$production" fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/
          done
          python3 helper/fitface-layout-golden/apply_golden_layout.py fitface-studio
          python3 helper/fitface-layout-golden/apply_golden_d2_layout.py fitface-studio
          if test -f helper/fitface-layout-golden/apply_golden_d4_layout.py; then
            python3 helper/fitface-layout-golden/apply_golden_d4_layout.py fitface-studio
          fi
          for production in GoldenD4CleanPlate.kt GoldenD4LayoutCompiler.kt GoldenD4Compiler.kt; do
            if test -f "helper/fitface-layout-golden/$production"; then
              cp "helper/fitface-layout-golden/$production" fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/
            fi
          done
      - name: Stage D4 compiler contract and inventory
        shell: bash
        run: |
          set -euo pipefail
          cp helper/fitface-layout-golden/Samsung00049GoldenD4CompilerTest.kt fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          cp helper/fitface-layout-golden/Samsung00049GoldenD4InventoryTest.kt fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          mkdir -p fitface-studio/core/format/src/test/resources/fixtures
          python3 helper/fitface-layout-golden/fetch_face00049_fixture.py fitface-studio/core/format/src/test/resources/fixtures/SM-R390_00049_256x402.bin
      - name: Emit D4 style2 inventory
        working-directory: fitface-studio
        run: ./gradlew --no-daemon --info :core:format:testDebugUnitTest --tests dev.fitface.studio.core.format.Samsung00049GoldenD4InventoryTest
      - name: Run D4 compiler contract
        id: d4_contract
        working-directory: fitface-studio
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --info --stacktrace :core:format:testDebugUnitTest --tests dev.fitface.studio.core.format.Samsung00049GoldenD4CompilerTest 2>&1 | tee /tmp/d4-contract.log
          rc=${PIPESTATUS[0]}
          diag="$(grep -m1 -E 'Fit3FormatException|AssertionError|ComparisonFailure' /tmp/d4-contract.log | sed 's/^[[:space:]]*//' | tr -cd '[:alnum:][:space:]_:.=-' | cut -c1-105)"
          if [[ -z "${diag}" ]]; then
            diag="no compact exception found"
          fi
          echo "diag=${diag}" >> "${GITHUB_OUTPUT}"
          exit "${rc}"
      - name: Publish D4 final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          D4_OUTCOME: ${{ steps.d4_contract.outcome }}
          D4_DIAG: ${{ steps.d4_contract.outputs.diag }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="D4 compiler contract: ${D4_OUTCOME}"
          if [[ "${D4_OUTCOME}" == "success" ]]; then
            state=success
          elif [[ "${D4_OUTCOME}" == "cancelled" ]]; then
            state=error
          elif [[ -n "${D4_DIAG}" ]]; then
            description="D4 failure: ${D4_DIAG}"
          fi
          description="${description:0:140}"
          curl --fail-with-body -sS -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"fitface-golden-d4\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
