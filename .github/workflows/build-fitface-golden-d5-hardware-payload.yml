name: Build FitFace Golden D5 Hardware Payload

on:
  push:
    branches: [work/fitface-four-style-golden]
    paths:
      - 'fitface-layout-golden/GoldenD5HardwareBaseline.kt'
      - 'fitface-layout-golden/GoldenD5Compiler.kt'
      - 'fitface-layout-golden/Samsung00049GoldenD5HardwareArtifactTest.kt'
      - '.github/workflows/build-fitface-golden-d5-hardware-payload.yml'
  workflow_dispatch:

concurrency:
  group: fitface-golden-d5-hardware-payload-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  d5-hardware-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper tree
        uses: actions/checkout@v4
        with:
          ref: work/fitface-four-style-golden
          path: helper
      - name: Check out pinned upstream
        uses: actions/checkout@v4
        with:
          repository: satvikgosai/fitface-studio
          ref: 45a9788d3877627fd5301e9ebba36ef6192d7962
          path: fitface-studio
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish D5 payload pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"fitface-golden-d5-hardware-payload\",\"description\":\"D5 validated hardware payload building\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - name: Apply locked Foundation and D1 D2 D3 D4 D5 stack
        shell: bash
        run: |
          set -euo pipefail
          python3 helper/fitface-build/run_manifest.py helper/fitface-build/v12-foundation-manifest.json --helper-root helper --check
          python3 helper/fitface-build/run_manifest.py helper/fitface-build/v12-foundation-manifest.json --helper-root helper --target-root fitface-studio
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/Samsung00003ClockOpticalCompensationTest.kt')
          t=p.read_text(); a='    @Test\n    fun style3ForegroundUsesUnifiedPerceptualMidpointCalibration() {'
          if t.count(a)!=1: raise SystemExit('v10 anchor drift')
          p.write_text(t.replace(a,'    @org.junit.Ignore("superseded by v11")\n'+a,1))
          PY
          python3 helper/fitface-layout-golden/apply_golden_format_patch.py fitface-studio
          python3 helper/fitface-layout-golden/apply_golden_optical_support.py fitface-studio
          for production in GoldenAmPmLocaleEditor.kt GoldenSemanticCompiler.kt GoldenWeatherIconCompiler.kt GoldenDateCompiler.kt GoldenWeatherTextEditor.kt GoldenD1Compiler.kt GoldenD1OpticalLock.kt GoldenD1HardwareCorrections.kt GoldenHardwareBaseline.kt GoldenD2Compiler.kt GoldenD2LayoutCompiler.kt GoldenD2HardwareBaseline.kt GoldenD3Compiler.kt GoldenD4Compiler.kt GoldenD5Compiler.kt GoldenD5HardwareBaseline.kt; do
            cp "helper/fitface-layout-golden/$production" fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/
          done
          python3 helper/fitface-layout-golden/apply_golden_layout.py fitface-studio
          python3 helper/fitface-layout-golden/apply_golden_d2_layout.py fitface-studio
      - name: Stage D5 payload contract
        shell: bash
        run: |
          set -euo pipefail
          cp helper/fitface-layout-golden/Samsung00049GoldenD5HardwareArtifactTest.kt fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          mkdir -p fitface-studio/core/format/src/test/resources/fixtures
          python3 helper/fitface-layout-golden/fetch_face00049_fixture.py fitface-studio/core/format/src/test/resources/fixtures/SM-R390_00049_256x402.bin
      - name: Build and validate D5 hardware payload
        id: payload
        working-directory: fitface-studio
        env:
          D5_HARDWARE_ARTIFACT_DIR: ${{ github.workspace }}/d5-hardware
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :core:format:testDebugUnitTest --tests dev.fitface.studio.core.format.Samsung00049GoldenD5HardwareArtifactTest
      - name: Package D5 hardware metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          payload=d5-hardware/SM-R390_00049_D5_hardware.bin
          test -s "$payload"
          sha256sum "$payload" | tee d5-hardware/sha256.txt
          size="$(stat -c%s "$payload")"
          sha="$(sha256sum "$payload" | awk '{print $1}')"
          {
            echo 'face_id=00049'
            echo "helper_commit=${GITHUB_SHA}"
            echo 'upstream_commit=45a9788d3877627fd5301e9ebba36ef6192d7962'
            echo "file=SM-R390_00049_D5_hardware.bin"
            echo "file_size=${size}"
            echo "sha256=${sha}"
            echo 'physical_watch_validation=NOT_YET_PERFORMED'
          } | tee d5-hardware/metadata.txt
      - name: Upload D5 hardware payload
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: fitface-golden-d5-hardware-payload
          path: d5-hardware/
          if-no-files-found: error
          retention-days: 14
      - name: Publish D5 payload final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_OUTCOME: ${{ steps.payload.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="D5 hardware payload failed"
          if [[ "${PAYLOAD_OUTCOME}" == "success" && "${METADATA_OUTCOME}" == "success" && "${UPLOAD_OUTCOME}" == "success" ]]; then
            state=success
            description="D5 hardware payload: validated and uploaded"
          elif [[ "${PAYLOAD_OUTCOME}" == "cancelled" || "${METADATA_OUTCOME}" == "cancelled" || "${UPLOAD_OUTCOME}" == "cancelled" ]]; then
            state=error
            description="D5 hardware payload: cancelled"
          fi
          curl --fail-with-body -sS -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"fitface-golden-d5-hardware-payload\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
