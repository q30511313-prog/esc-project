name: Inspect FitFace 00049 Date Inventory

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/inspect_00049_date_inventory.py'
      - '.github/workflows/inspect-fitface-date-inventory.yml'

permissions:
  contents: read

jobs:
  inspect-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch real Samsung 00049 fixture
        shell: bash
        run: |
          python3 fitface-layout-golden/fetch_face00049_fixture.py /tmp/SM-R390_00049_256x402.bin

      - name: Print exact date and Pair inventory
        shell: bash
        run: |
          python3 fitface-layout-golden/inspect_00049_date_inventory.py /tmp/SM-R390_00049_256x402.bin
