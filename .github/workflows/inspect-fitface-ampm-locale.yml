name: Inspect FitFace AM PM Locale

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/fetch_stock_face_fixture.py'
      - 'fitface-layout-golden/inspect_stock_locale.py'
      - '.github/workflows/inspect-fitface-ampm-locale.yml'

permissions:
  contents: read

jobs:
  inspect-locale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch 00049 and stock AM PM faces
        shell: bash
        run: |
          python3 fitface-layout-golden/fetch_stock_face_fixture.py 00049 /tmp/00049.bin
          python3 fitface-layout-golden/fetch_stock_face_fixture.py 00106 /tmp/00106.bin
          python3 fitface-layout-golden/fetch_stock_face_fixture.py 00033 /tmp/00033.bin
          python3 fitface-layout-golden/fetch_stock_face_fixture.py 00069 /tmp/00069.bin
          python3 fitface-layout-golden/fetch_stock_face_fixture.py 00100 /tmp/00100.bin
          python3 fitface-layout-golden/fetch_stock_face_fixture.py 00124 /tmp/00124.bin

      - name: Print locale, font binding, and seq5 Pair structures
        shell: bash
        run: |
          python3 fitface-layout-golden/inspect_stock_locale.py \
            /tmp/00049.bin /tmp/00106.bin /tmp/00033.bin /tmp/00069.bin /tmp/00100.bin /tmp/00124.bin
