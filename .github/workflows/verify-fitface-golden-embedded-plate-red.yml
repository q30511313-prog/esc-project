name: Verify FitFace Golden Embedded Plate RED

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/Samsung00049GoldenLayoutTest.kt'
      - '.github/workflows/verify-fitface-golden-embedded-plate-red.yml'

permissions:
  contents: read

jobs:
  embedded-plate-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned upstream
        shell: bash
        run: |
          git clone https://github.com/satvikgosai/fitface-studio.git fitface-studio
          git -C fitface-studio checkout 45a9788d3877627fd5301e9ebba36ef6192d7962

      - name: Install current Task 7 production without embedded plate support
        shell: bash
        run: |
          python3 fitface-layout-golden/apply_golden_format_patch.py fitface-studio
          for production in \
            GoldenAmPmLocaleEditor.kt \
            GoldenSemanticCompiler.kt \
            GoldenWeatherIconCompiler.kt \
            GoldenDateCompiler.kt \
            GoldenWeatherTextEditor.kt \
            GoldenD1Compiler.kt; do
            cp "fitface-layout-golden/$production" \
              fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/
          done
          python3 fitface-layout-golden/apply_golden_layout.py fitface-studio
          cp fitface-layout-golden/Samsung00049GoldenLayoutTest.kt \
            fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          mkdir -p fitface-studio/core/format/src/test/resources/fixtures
          python3 fitface-layout-golden/fetch_face00049_fixture.py \
            fitface-studio/core/format/src/test/resources/fixtures/SM-R390_00049_256x402.bin

      - name: RED — approved embedded plate support is absent
        shell: bash
        run: |
          set +e
          cd fitface-studio
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests dev.fitface.studio.core.format.Samsung00049GoldenLayoutTest \
            > ../embedded-plate-red.log 2>&1
          status=$?
          set -e
          cd ..
          cat embedded-plate-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected embedded-plate RED failure but test passed.' >&2
            exit 1
          fi
          grep -F "GoldenD1CleanPlate" embedded-plate-red.log
          grep -F "cleanPlateArgb" embedded-plate-red.log
          echo 'EMBEDDED PLATE RED confirmed: approved payload object/automatic compile path are absent.'
