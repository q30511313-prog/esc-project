name: Temporary FitFace v11 Patch15 Calibration

on:
  push:
    branches:
      - tmp-fitface-v11

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper
        uses: actions/checkout@v4
        with:
          ref: tmp-fitface-v11
          path: helper

      - name: Check out FitFace Studio upstream
        uses: actions/checkout@v4
        with:
          repository: satvikgosai/fitface-studio
          ref: 45a9788d3877627fd5301e9ebba36ef6192d7962
          path: fitface-studio

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install helpers and v11 regression
        run: |
          cp helper/fitface-lcd-color/SpriteTint.kt fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/SpriteTint.kt
          cp helper/fitface-lcd-color/LcdPalette.kt fitface-studio/core/model/src/main/kotlin/dev/fitface/studio/core/model/LcdPalette.kt
          cp helper/fitface-lcd-color/Samsung00003ClockOpticalCompensationTest.kt fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/Samsung00003ClockOpticalCompensationTest.kt
          cp helper/fitface-lcd-color/Samsung00003ClockOpticalV11Test.kt fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/Samsung00003ClockOpticalV11Test.kt

      - name: Apply v10 integrated patch stack
        run: |
          sed -i 's/if count != 1:/if count < 1:/' helper/fitface-sequence-experiment/apply_patch.py
          python3 helper/fitface-sequence-experiment/apply_patch.py fitface-studio
          python3 helper/fitface-pair-binding/apply_patch.py fitface-studio
          sed -i 's/if count != 1:/if count < 1:/' helper/fitface-lcd-color/apply_patch.py
          python3 helper/fitface-lcd-color/apply_patch.py fitface-studio
          python3 helper/fitface-lcd-color/apply_sprite_alpha_mask_fix.py fitface-studio
          python3 helper/fitface-lcd-color/apply_clock_sprite_group_color_fix.py fitface-studio
          python3 helper/fitface-lcd-color/apply_composite_color_patch.py fitface-studio
          python3 helper/fitface-lcd-color/apply_static_color_patch.py fitface-studio
          python3 helper/fitface-lcd-color/apply_casio_clock_chrome_tone_fix.py fitface-studio
          python3 helper/fitface-lcd-color/apply_samsung00003_foreground_tone_fix.py fitface-studio
          python3 helper/fitface-lcd-color/apply_samsung00003_clock_optical_compensation.py fitface-studio
          python3 helper/fitface-lcd-color/normalize_pair_color_anchor.py fitface-studio
          python3 helper/fitface-lcd-color/apply_hardware_color_fix.py fitface-studio

      - name: RED - patch15 v11 must fail against v10 production code
        working-directory: fitface-studio
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests '*Samsung00003ClockOpticalV11Test*' > /tmp/v11-red.log 2>&1
          status=$?
          set -e
          cat /tmp/v11-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected v11 test to fail against v10 implementation.'
            exit 1
          fi
          grep -q 'Samsung00003ClockOpticalV11Test' /tmp/v11-red.log
          echo 'RED confirmed: v10 implementation does not satisfy patch15 v11 calibration.'
