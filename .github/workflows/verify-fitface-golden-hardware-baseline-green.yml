name: Verify FitFace Golden Hardware Baseline GREEN

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/GoldenHardwareBaseline.kt'
      - 'fitface-layout-golden/GoldenD1OpticalLock.kt'
      - 'fitface-layout-golden/GoldenD1HardwareCorrections.kt'
      - 'fitface-layout-golden/apply_golden_optical_support.py'
      - 'fitface-layout-golden/Samsung00049GoldenHardwareBaselineTest.kt'
      - 'fitface-layout-golden/Samsung00049GoldenLayoutTest.kt'
      - 'fitface-layout-golden/apply_golden_layout.py'
      - 'fitface-layout-golden/golden_d1_clean_plate_rgb565.zlib.b64.part*'
      - '.github/workflows/verify-fitface-golden-hardware-baseline-green.yml'

permissions:
  contents: read

jobs:
  golden-hardware-baseline-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned upstream
        shell: bash
        run: |
          git clone https://github.com/satvikgosai/fitface-studio.git fitface-studio
          git -C fitface-studio checkout 45a9788d3877627fd5301e9ebba36ef6192d7962

      - name: Apply approved Foundation v11/v12 stack
        shell: bash
        run: |
          python3 fitface-build/run_manifest.py \
            fitface-build/v12-foundation-manifest.json \
            --helper-root . \
            --check
          python3 fitface-build/run_manifest.py \
            fitface-build/v12-foundation-manifest.json \
            --helper-root . \
            --target-root fitface-studio

      - name: Install Golden D1 hardware baseline and regressions
        shell: bash
        run: |
          python3 fitface-layout-golden/apply_golden_format_patch.py fitface-studio
          python3 fitface-layout-golden/apply_golden_optical_support.py fitface-studio
          for production in \
            GoldenAmPmLocaleEditor.kt \
            GoldenSemanticCompiler.kt \
            GoldenWeatherIconCompiler.kt \
            GoldenDateCompiler.kt \
            GoldenWeatherTextEditor.kt \
            GoldenD1Compiler.kt \
            GoldenD1OpticalLock.kt \
            GoldenD1HardwareCorrections.kt \
            GoldenHardwareBaseline.kt; do
            cp "fitface-layout-golden/$production" \
              fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/
          done
          python3 fitface-layout-golden/apply_golden_layout.py fitface-studio
          cp fitface-layout-golden/Samsung00049GoldenHardwareBaselineTest.kt \
            fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          cp fitface-layout-golden/Samsung00049GoldenD1CompilerTest.kt \
            fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          cp fitface-layout-golden/Samsung00049GoldenLayoutTest.kt \
            fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          mkdir -p fitface-studio/core/format/src/test/resources/fixtures
          python3 fitface-layout-golden/fetch_face00049_fixture.py \
            fitface-studio/core/format/src/test/resources/fixtures/SM-R390_00049_256x402.bin

      - name: GREEN — full baseline selector, clean plate, optical lock, HW1, and atomic D1
        shell: bash
        run: |
          cd fitface-studio
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests dev.fitface.studio.core.format.Samsung00049GoldenHardwareBaselineTest \
            --tests dev.fitface.studio.core.format.Samsung00049GoldenLayoutTest \
            --tests dev.fitface.studio.core.format.Samsung00049GoldenD1CompilerTest
