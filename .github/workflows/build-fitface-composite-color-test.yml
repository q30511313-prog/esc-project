name: Temporary FitFace Composite Color Experiment

on:
  push:
    branches:
      - tmp-fitface-composite
  pull_request:
    branches:
      - tmp-fitface-build

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper
        uses: actions/checkout@v4
        with:
          ref: tmp-fitface-composite
          path: helper

      - name: Check out FitFace Studio upstream
        uses: actions/checkout@v4
        with:
          repository: satvikgosai/fitface-studio
          ref: 45a9788d3877627fd5301e9ebba36ef6192d7962
          path: fitface-studio

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add new regression tests only
        run: |
          cp helper/fitface-lcd-color/CompositeColorOverrideTest.kt \
            fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/CompositeColorOverrideTest.kt
          cp helper/fitface-lcd-color/LcdPaletteTest.kt \
            fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/LcdPaletteTest.kt

      - name: RED - composite color editing must be absent upstream
        working-directory: fitface-studio
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests '*CompositeColorOverrideTest*' > /tmp/red-comp.log 2>&1
          status=$?
          set -e
          cat /tmp/red-comp.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected composite color test to fail before implementation.'
            exit 1
          fi
          grep -q 'recolorCompositeWidgetAcrossStyles' /tmp/red-comp.log
          echo 'RED confirmed: composite color API is absent before implementation.'

      - name: RED - approved LCD palette must be absent upstream
        working-directory: fitface-studio
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests '*LcdPaletteTest*' > /tmp/red-palette.log 2>&1
          status=$?
          set -e
          cat /tmp/red-palette.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected palette test to fail before implementation.'
            exit 1
          fi
          grep -q 'LcdPalette' /tmp/red-palette.log
          echo 'RED confirmed: LcdPalette is absent before implementation.'
