name: Verify D5 Transport Fix

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/apply_golden_d5_transport_fix.py'
      - '.github/workflows/verify-fitface-d5-transport-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper tree
        uses: actions/checkout@v4
        with:
          ref: work/fitface-four-style-golden
          path: helper

      - name: Check out upstream install-fixed baseline
        uses: actions/checkout@v4
        with:
          repository: satvikgosai/fitface-studio
          ref: 4fb7323f814cc886adb769fb93fdf1df71001b11
          path: fitface-studio

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply D5 transport hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 helper/fitface-layout-golden/apply_golden_d5_transport_fix.py fitface-studio
          grep -F 'effectiveReleaseAcknowledgement' fitface-studio/core/delivery/src/main/kotlin/dev/fitface/studio/core/delivery/Fit3DirectInstaller.kt
          grep -F 'current.pluginNearbyGranted != false' fitface-studio/core/delivery/src/main/kotlin/dev/fitface/studio/core/delivery/Fit3DirectInstaller.kt
          grep -F 'state.peersCached && !state.pluginChannelReleased && !nearbySwitch' fitface-studio/feature/editor/src/main/kotlin/dev/fitface/studio/feature/editor/EditorScreen.kt

      - name: Compile changed runtime surfaces
        working-directory: fitface-studio
        run: ./gradlew --no-daemon :core:delivery:compileDebugKotlin :feature:editor:compileDebugKotlin

      - name: Run delivery and editor unit regressions
        working-directory: fitface-studio
        run: ./gradlew --no-daemon :core:delivery:testDebugUnitTest :feature:editor:testDebugUnitTest
