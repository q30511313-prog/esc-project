name: Inspect FitFace 00049 Weather Frames

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/extract_00049_weather_frames.py'
      - '.github/workflows/inspect-fitface-weather-frames.yml'

permissions:
  contents: read

jobs:
  weather-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch real Samsung 00049 fixture
        shell: bash
        run: |
          python3 fitface-layout-golden/fetch_face00049_fixture.py /tmp/SM-R390_00049_256x402.bin

      - name: Fingerprint all 24 seq69 weather frames
        shell: bash
        run: |
          python3 fitface-layout-golden/extract_00049_weather_frames.py /tmp/SM-R390_00049_256x402.bin
