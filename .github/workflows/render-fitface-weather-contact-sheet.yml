name: Render FitFace 00049 Weather Contact Sheet

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/render_00049_weather_contact_sheet.py'
      - '.github/workflows/render-fitface-weather-contact-sheet.yml'

permissions:
  contents: read

jobs:
  weather-contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real Samsung 00049 fixture
        shell: bash
        run: python3 fitface-layout-golden/fetch_face00049_fixture.py /tmp/00049.bin
      - name: Render exact 24-frame contact sheet
        shell: bash
        run: python3 fitface-layout-golden/render_00049_weather_contact_sheet.py /tmp/00049.bin weather-00049-contact-sheet.png
      - name: Upload diagnostic contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: fitface-00049-weather-contact-sheet
          path: weather-00049-contact-sheet.png
          if-no-files-found: error
