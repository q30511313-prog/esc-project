name: Verify FitFace Golden Weather Contact Sheet

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/build_weather_contact_sheet.py'
      - '.github/workflows/verify-fitface-golden-weather-contact-sheet.yml'

permissions:
  contents: read

jobs:
  weather-contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real Samsung 00049 fixture
        shell: bash
        run: |
          mkdir -p fixture out
          python3 fitface-layout-golden/fetch_face00049_fixture.py \
            fixture/SM-R390_00049_256x402.bin
      - name: Build deterministic 24-frame sheet
        shell: bash
        run: |
          python3 fitface-layout-golden/build_weather_contact_sheet.py \
            fixture/SM-R390_00049_256x402.bin \
            out/Golden-weather-contact-sheet.png
      - name: Verify PNG contract
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path('out/Golden-weather-contact-sheet.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert data[12:16] == b'IHDR'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (432, 256), (width, height)
          assert len(data) > 1000
          print(f'PNG_BYTES={len(data)}')
          PY
          sha256sum out/Golden-weather-contact-sheet.png
