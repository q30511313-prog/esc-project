name: Verify FitFace Golden D2

on:
  push:
    branches: [work/fitface-four-style-golden]
    paths:
      - 'fitface-layout-golden/**'
      - '.github/workflows/verify-fitface-golden-d2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d2-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper tree
        uses: actions/checkout@v4
        with:
          ref: work/fitface-four-style-golden
          path: helper
      - name: Check out pinned upstream
        uses: actions/checkout@v4
        with:
          repository: satvikgosai/fitface-studio
          ref: 45a9788d3877627fd5301e9ebba36ef6192d7962
          path: fitface-studio
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply locked Foundation
        shell: bash
        run: |
          set -euo pipefail
          python3 helper/fitface-build/run_manifest.py helper/fitface-build/v12-foundation-manifest.json --helper-root helper --check
          python3 helper/fitface-build/run_manifest.py helper/fitface-build/v12-foundation-manifest.json --helper-root helper --target-root fitface-studio
      - name: Isolate superseded v10 optical assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/Samsung00003ClockOpticalCompensationTest.kt')
          t=p.read_text()
          a='    @Test\n    fun style3ForegroundUsesUnifiedPerceptualMidpointCalibration() {'
          r='    @org.junit.Ignore("superseded by v11")\n'+a
          if t.count(a)!=1: raise SystemExit('v10 anchor drift')
          p.write_text(t.replace(a,r,1))
          PY
      - name: Apply proven Golden support stack
        shell: bash
        run: |
          set -euo pipefail
          python3 helper/fitface-layout-golden/apply_golden_format_patch.py fitface-studio
          python3 helper/fitface-layout-golden/apply_golden_optical_support.py fitface-studio
          for production in GoldenAmPmLocaleEditor.kt GoldenSemanticCompiler.kt GoldenWeatherIconCompiler.kt GoldenDateCompiler.kt GoldenWeatherTextEditor.kt GoldenD1Compiler.kt GoldenD1OpticalLock.kt GoldenD1HardwareCorrections.kt GoldenHardwareBaseline.kt GoldenD2Compiler.kt GoldenD2LayoutCompiler.kt; do
            cp "helper/fitface-layout-golden/$production" fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/
          done
          python3 helper/fitface-layout-golden/apply_golden_layout.py fitface-studio
          python3 helper/fitface-layout-golden/apply_golden_d2_layout.py fitface-studio
      - name: Stage D2 contracts
        shell: bash
        run: |
          set -euo pipefail
          cp helper/fitface-layout-golden/Samsung00049GoldenD2CompilerTest.kt fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          cp helper/fitface-layout-golden/Samsung00049GoldenD2LayoutTest.kt fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          cp helper/fitface-layout-golden/Samsung00049GoldenD2HardwareBaselineTest.kt fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          mkdir -p fitface-studio/core/format/src/test/resources/fixtures
          python3 helper/fitface-layout-golden/fetch_face00049_fixture.py fitface-studio/core/format/src/test/resources/fixtures/SM-R390_00049_256x402.bin
      - name: Run D2 contracts
        working-directory: fitface-studio
        run: ./gradlew --no-daemon :core:format:testDebugUnitTest --tests dev.fitface.studio.core.format.Samsung00049GoldenD2CompilerTest --tests dev.fitface.studio.core.format.Samsung00049GoldenD2LayoutTest --tests dev.fitface.studio.core.format.Samsung00049GoldenD2HardwareBaselineTest
