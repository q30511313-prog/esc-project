name: Verify FitFace Golden Date RED

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/Samsung00049DateCompilerTest.kt'
      - '.github/workflows/verify-fitface-date-red.yml'

permissions:
  contents: read

jobs:
  date-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned upstream
        shell: bash
        run: |
          git clone https://github.com/satvikgosai/fitface-studio.git fitface-studio
          git -C fitface-studio checkout 45a9788d3877627fd5301e9ebba36ef6192d7962

      - name: Install proven Golden prerequisites
        shell: bash
        run: |
          python3 fitface-layout-golden/apply_golden_format_patch.py fitface-studio
          cp fitface-layout-golden/GoldenSemanticCompiler.kt \
            fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/GoldenSemanticCompiler.kt
          cp fitface-layout-golden/Samsung00049DateCompilerTest.kt \
            fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          mkdir -p fitface-studio/core/format/src/test/resources/fixtures
          python3 fitface-layout-golden/fetch_face00049_fixture.py \
            fitface-studio/core/format/src/test/resources/fixtures/SM-R390_00049_256x402.bin

      - name: RED — date compiler types are absent
        shell: bash
        run: |
          set +e
          cd fitface-studio
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests dev.fitface.studio.core.format.Samsung00049DateCompilerTest \
            > ../date-red.log 2>&1
          status=$?
          set -e
          cat ../date-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected date RED failure but test passed.' >&2
            exit 1
          fi
          grep -F "Unresolved reference 'GoldenDateCompiler'" ../date-red.log
          grep -F "Unresolved reference 'GoldenDateMode'" ../date-red.log
          echo 'DATE RED confirmed: only the date compiler contract is unimplemented.'
