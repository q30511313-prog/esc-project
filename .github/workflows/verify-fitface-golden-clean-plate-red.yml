name: Verify FitFace Golden Clean Plate RED

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/test_build_clean_plate.py'
      - '.github/workflows/verify-fitface-golden-clean-plate-red.yml'

permissions:
  contents: read

jobs:
  clean-plate-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check pillow numpy

      - name: RED — clean-plate builder is absent
        shell: bash
        run: |
          set +e
          python3 fitface-layout-golden/test_build_clean_plate.py > clean-plate-red.log 2>&1
          status=$?
          set -e
          cat clean-plate-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected clean-plate RED failure but tests passed.' >&2
            exit 1
          fi
          grep -F "No module named 'build_clean_plate'" clean-plate-red.log
          echo 'CLEAN PLATE RED confirmed: production builder is missing.'
