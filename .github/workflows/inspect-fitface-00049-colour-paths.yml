name: Inspect FitFace 00049 Colour Paths

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/inspect_00049_date_inventory.py'
      - '.github/workflows/inspect-fitface-00049-colour-paths.yml'

permissions:
  contents: read

jobs:
  inspect-colour-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real Samsung 00049 fixture
        shell: bash
        run: |
          mkdir -p fixture
          python3 fitface-layout-golden/fetch_face00049_fixture.py \
            fixture/SM-R390_00049_256x402.bin
      - name: Dump Composite and font binding evidence
        shell: bash
        run: |
          python3 fitface-layout-golden/inspect_00049_date_inventory.py \
            fixture/SM-R390_00049_256x402.bin
