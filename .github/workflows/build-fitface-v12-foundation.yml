name: FitFace v12 Foundation Equivalence

on:
  push:
    branches:
      - work/fitface-v12-foundation
    paths:
      - 'fitface-build/**'
      - '.github/workflows/build-fitface-v12-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable v11 Stable helper tree
        uses: actions/checkout@v4
        with:
          ref: fitface-v11-stable
          path: legacy-helper

      - name: Check out v12 Foundation helper tree
        uses: actions/checkout@v4
        with:
          ref: work/fitface-v12-foundation
          path: foundation-helper

      - name: Run Foundation manifest unit tests
        run: python3 -m unittest discover -s foundation-helper/fitface-build -p 'test_*.py' -v

      - name: Check locked Foundation manifest and helper paths
        run: |
          python3 foundation-helper/fitface-build/run_manifest.py \
            foundation-helper/fitface-build/v12-foundation-manifest.json \
            --helper-root foundation-helper \
            --check

      - name: Check out legacy FitFace Studio upstream
        uses: actions/checkout@v4
        with:
          repository: satvikgosai/fitface-studio
          ref: 45a9788d3877627fd5301e9ebba36ef6192d7962
          path: legacy-fitface-studio

      - name: Check out Foundation FitFace Studio upstream
        uses: actions/checkout@v4
        with:
          repository: satvikgosai/fitface-studio
          ref: 45a9788d3877627fd5301e9ebba36ef6192d7962
          path: foundation-fitface-studio

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply legacy v11 helper and regression files
        run: |
          cp legacy-helper/fitface-lcd-color/SpriteTint.kt legacy-fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/SpriteTint.kt
          cp legacy-helper/fitface-lcd-color/LcdPalette.kt legacy-fitface-studio/core/model/src/main/kotlin/dev/fitface/studio/core/model/LcdPalette.kt
          cp legacy-helper/fitface-lcd-color/LcdSpriteTintTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/LcdSpriteTintTest.kt
          cp legacy-helper/fitface-lcd-color/LcdPaletteTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/LcdPaletteTest.kt
          cp legacy-helper/fitface-lcd-color/CompositeColorOverrideTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/CompositeColorOverrideTest.kt
          cp legacy-helper/fitface-lcd-color/StaticRasterTintTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/StaticRasterTintTest.kt
          cp legacy-helper/fitface-lcd-color/StaticAlphaMaskTintTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/StaticAlphaMaskTintTest.kt
          cp legacy-helper/fitface-lcd-color/AnchoredPairColorTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/AnchoredPairColorTest.kt
          cp legacy-helper/fitface-lcd-color/DuplicateSequencePairColorTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/DuplicateSequencePairColorTest.kt
          cp legacy-helper/fitface-lcd-color/ClockSpriteColorGroupTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/ClockSpriteColorGroupTest.kt
          cp legacy-helper/fitface-lcd-color/CasioClockChromeToneTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/CasioClockChromeToneTest.kt
          cp legacy-helper/fitface-lcd-color/Samsung00003ForegroundToneTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/Samsung00003ForegroundToneTest.kt
          cp legacy-helper/fitface-lcd-color/Samsung00003ClockOpticalCompensationTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/Samsung00003ClockOpticalCompensationTest.kt
          cp legacy-helper/fitface-lcd-color/Samsung00003ClockOpticalV11Test.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/Samsung00003ClockOpticalV11Test.kt

      - name: Apply legacy v11 patch stack verbatim
        run: |
          sed -i 's/if count != 1:/if count < 1:/' legacy-helper/fitface-sequence-experiment/apply_patch.py
          python3 legacy-helper/fitface-sequence-experiment/apply_patch.py legacy-fitface-studio
          cp legacy-helper/fitface-sequence-experiment/SequenceOverrideTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/SequenceOverrideTest.kt
          python3 legacy-helper/fitface-pair-binding/apply_patch.py legacy-fitface-studio
          cp legacy-helper/fitface-pair-binding/PairBindingOverrideTest.kt legacy-fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/PairBindingOverrideTest.kt
          sed -i 's/if count != 1:/if count < 1:/' legacy-helper/fitface-lcd-color/apply_patch.py
          python3 legacy-helper/fitface-lcd-color/apply_patch.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/apply_sprite_alpha_mask_fix.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/apply_clock_sprite_group_color_fix.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/apply_composite_color_patch.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/apply_static_color_patch.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/apply_casio_clock_chrome_tone_fix.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/apply_samsung00003_foreground_tone_fix.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/apply_samsung00003_clock_optical_compensation.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/apply_samsung00003_clock_optical_v11.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/normalize_pair_color_anchor.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/apply_hardware_color_fix.py legacy-fitface-studio
          python3 legacy-helper/fitface-lcd-color/apply_bright_lcd_label.py legacy-fitface-studio
          sed -i 's/applicationId = "dev.fitface.studio"/applicationId = "dev.fitface.studio.lcdcomposite.v11"/' legacy-fitface-studio/app/build.gradle.kts

      - name: Apply v12 Foundation manifest pipeline
        run: |
          python3 foundation-helper/fitface-build/run_manifest.py \
            foundation-helper/fitface-build/v12-foundation-manifest.json \
            --helper-root foundation-helper \
            --target-root foundation-fitface-studio

      - name: Run Foundation focused format regressions from manifest
        working-directory: foundation-fitface-studio
        run: |
          mapfile -t TESTS < <(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('../foundation-helper/fitface-build/v12-foundation-manifest.json').read_text())
          for test_name in manifest['focused_tests']:
              print(test_name)
          PY
          )
          ARGS=()
          for test_name in "${TESTS[@]}"; do
            ARGS+=(--tests "*${test_name}*")
          done
          ./gradlew --no-daemon :core:format:testDebugUnitTest "${ARGS[@]}"

      - name: Run Foundation editor regression suite
        working-directory: foundation-fitface-studio
        run: ./gradlew --no-daemon :feature:editor:testDebugUnitTest

      - name: Build legacy v11 baseline APK
        working-directory: legacy-fitface-studio
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build Foundation APK
        working-directory: foundation-fitface-studio
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Compare every unzipped APK entry by SHA-256
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          import zipfile

          legacy = Path('legacy-fitface-studio/app/build/outputs/apk/debug/app-debug.apk')
          foundation = Path('foundation-fitface-studio/app/build/outputs/apk/debug/app-debug.apk')
          if not legacy.is_file() or not foundation.is_file():
              raise SystemExit('missing legacy or Foundation APK')

          with zipfile.ZipFile(legacy) as za, zipfile.ZipFile(foundation) as zb:
              names_a = za.namelist()
              names_b = zb.namelist()
              if len(names_a) != len(set(names_a)) or len(names_b) != len(set(names_b)):
                  raise SystemExit('duplicate ZIP entry detected')

              only_a = sorted(set(names_a) - set(names_b))
              only_b = sorted(set(names_b) - set(names_a))
              if only_a or only_b:
                  print('legacy-only entries:', only_a)
                  print('foundation-only entries:', only_b)
                  raise SystemExit('APK entry-name sets differ')

              differing = []
              for name in sorted(names_a):
                  digest_a = hashlib.sha256(za.read(name)).hexdigest()
                  digest_b = hashlib.sha256(zb.read(name)).hexdigest()
                  if digest_a != digest_b:
                      differing.append((name, digest_a, digest_b))

          print(f'entry count: {len(names_a)}')
          print(f'differing entry count: {len(differing)}')
          for name, digest_a, digest_b in differing:
              print(f'DIFF {name}: legacy={digest_a} foundation={digest_b}')
          if differing:
              sys.exit(1)
          print('Foundation equivalence PASS: every APK entry is byte-identical to v11 Stable legacy output')
          PY

      - name: Prepare Foundation artifact and hash
        run: |
          mkdir -p foundation-output
          cp foundation-fitface-studio/app/build/outputs/apk/debug/app-debug.apk \
            foundation-output/FitFace-Studio-GSHOCK-LCD-v12-FOUNDATION.apk
          sha256sum foundation-output/FitFace-Studio-GSHOCK-LCD-v12-FOUNDATION.apk \
            | tee foundation-output/FitFace-Studio-GSHOCK-LCD-v12-FOUNDATION.sha256
          test "$(stat -c%s foundation-output/FitFace-Studio-GSHOCK-LCD-v12-FOUNDATION.apk)" -gt 30000000

      - name: Upload verified Foundation APK
        uses: actions/upload-artifact@v4
        with:
          name: FitFace-Studio-GSHOCK-LCD-v12-FOUNDATION-EQUIVALENT
          path: foundation-output/*
          if-no-files-found: error
          retention-days: 90
