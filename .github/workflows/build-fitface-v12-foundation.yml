name: FitFace v12 Foundation Contract

on:
  push:
    branches:
      - work/fitface-v12-foundation
    paths:
      - 'fitface-build/**'
      - '.github/workflows/build-fitface-v12-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Foundation branch
        uses: actions/checkout@v4
        with:
          ref: work/fitface-v12-foundation

      - name: Run Foundation manifest unit tests
        run: python3 -m unittest discover -s fitface-build -p 'test_*.py' -v

      - name: Check locked Foundation manifest and helper paths
        run: |
          python3 fitface-build/run_manifest.py \
            fitface-build/v12-foundation-manifest.json \
            --helper-root . \
            --check
