name: Inspect FitFace 00049 Weather ASCII

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/dump_00049_weather_ascii.py'
      - '.github/workflows/inspect-fitface-weather-ascii.yml'

permissions:
  contents: read

jobs:
  weather-ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch real Samsung 00049 fixture
        shell: bash
        run: |
          python3 fitface-layout-golden/fetch_face00049_fixture.py /tmp/SM-R390_00049_256x402.bin

      - name: Print 24 compact alpha silhouettes
        shell: bash
        run: |
          python3 fitface-layout-golden/dump_00049_weather_ascii.py /tmp/SM-R390_00049_256x402.bin
