name: Verify FitFace Golden Main Time RED

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/Samsung00049MainTimeCompilerTest.kt'
      - '.github/workflows/verify-fitface-main-time-red.yml'

permissions:
  contents: read

jobs:
  main-time-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned upstream
        shell: bash
        run: |
          git clone https://github.com/satvikgosai/fitface-studio.git fitface-studio
          git -C fitface-studio checkout 45a9788d3877627fd5301e9ebba36ef6192d7962

      - name: Install proven Golden prerequisites
        shell: bash
        run: |
          python3 fitface-layout-golden/apply_golden_format_patch.py fitface-studio
          cp fitface-layout-golden/GoldenAmPmLocaleEditor.kt fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/
          cp fitface-layout-golden/GoldenSemanticCompiler.kt fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/
          cp fitface-layout-golden/GoldenDateCompiler.kt fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/
          cp fitface-layout-golden/GoldenWeatherTextEditor.kt fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/
          cp fitface-layout-golden/Samsung00049MainTimeCompilerTest.kt fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/
          mkdir -p fitface-studio/core/format/src/test/resources/fixtures
          python3 fitface-layout-golden/fetch_face00049_fixture.py fitface-studio/core/format/src/test/resources/fixtures/SM-R390_00049_256x402.bin

      - name: RED — main time compiler method is absent
        shell: bash
        run: |
          set +e
          cd fitface-studio
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests dev.fitface.studio.core.format.Samsung00049MainTimeCompilerTest \
            > ../main-time-red.log 2>&1
          status=$?
          set -e
          cat ../main-time-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected main-time RED failure but test passed.' >&2
            exit 1
          fi
          grep -F "Unresolved reference 'compileMainTime'" ../main-time-red.log
          echo 'MAIN TIME RED confirmed: production method is missing.'
