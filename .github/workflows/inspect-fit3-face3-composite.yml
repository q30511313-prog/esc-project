name: Temporary Inspect Fit3 Face 00003 Composite

on:
  push:
    branches:
      - tmp-fitface-build

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download face 00003 and dump type-13 records
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, pathlib, struct, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET, zipfile

          out=pathlib.Path('out'); out.mkdir(exist_ok=True)
          appid='com.samsung.fit3watchface.sm_r390_0003'
          suffix='GALAXYAPPSAPI'
          h=base64.b64encode(hashlib.sha1((appid+suffix).encode('latin1')).digest()).decode()
          params={
              'csc':'NONE','sdkVer':'36','callerId':'com.samsung.wearable.fit3plugin',
              'versionCode':'126071051','mcc':'450','mnc':'10',
              'systemId':str(int(time.time()*1000)),'extuk':'','abiType':'64',
              'deviceId':'SM-R390','loginType':'N','oneUiVersion':'0','cc':'KOR','pd':'0',
              'appInfo':appid,'hashValue':h,
          }
          url='https://vas.samsungapps.com/vas/stub/gearAppDownload.as?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          xml=urllib.request.urlopen(req, timeout=30).read()
          (out/'download.xml').write_bytes(xml)
          root=ET.fromstring(xml)
          vals={e.tag:(e.text or '').strip() for e in root.iter()}
          print('download tags', vals)
          dl=vals.get('downloadURI') or vals.get('downloadUri') or vals.get('downloadURL') or vals.get('downloadUrl')
          if not dl:
              # print XML and fail explicitly so logs preserve server response
              print(xml.decode('utf-8','replace'))
              raise SystemExit('No download URI in response')
          req=urllib.request.Request(dl, headers={'User-Agent':'Mozilla/5.0'})
          apk=urllib.request.urlopen(req, timeout=60).read()
          (out/'face00003.apk').write_bytes(apk)
          print('apk bytes',len(apk))
          z=zipfile.ZipFile(io.BytesIO(apk))
          member=[n for n in z.namelist() if n.endswith('/SM-R390_00003_256x402.bin') or n.endswith('SM-R390_00003_256x402.bin')]
          print('container members',member)
          if len(member)!=1: raise SystemExit('container member not unique')
          data=z.read(member[0])
          (out/'SM-R390_00003_256x402.bin').write_bytes(data)

          u16=lambda b,o: struct.unpack_from('<H',b,o)[0]
          u32=lambda b,o: struct.unpack_from('<I',b,o)[0]
          count=u32(data,12)
          lines=[]
          for i in range(count):
              ro=32+i*74
              raw=data[ro:ro+74]
              path=raw[:64].split(b'\0',1)[0].decode('utf-8','replace')
              off=u32(raw,64); size=u32(raw,68)
              if path.endswith('style3.bin') or path.endswith('style0.bin'):
                  entry=data[off:off+size]
                  wc=u32(entry,4); imageoff=u32(entry,20)
                  cur=24
                  lines.append(f'ENTRY {path} widgets={wc} imageoff={imageoff}')
                  while cur<imageoff:
                      typ=u32(entry,cur); seq=u32(entry,cur+4); idxsz=u32(entry,cur+12)
                      recsz=idxsz & 0xFFFF; gidx=idxsz>>16
                      x=struct.unpack_from('<h',entry,cur+0x18)[0]
                      y=struct.unpack_from('<h',entry,cur+0x1A)[0]
                      w=u16(entry,cur+0x1C); hgt=u16(entry,cur+0x1E)
                      words=[u32(entry,cur+36+j*4) for j in range((recsz-36)//4)]
                      if typ==13:
                          lines.append(f'COMP g#{gidx} seq={seq} xy=({x},{y}) wh={w}x{hgt} size={recsz} words='+','.join(f'0x{v:08X}' for v in words))
                      cur += recsz
          text='\n'.join(lines)+'\n'
          print(text)
          (out/'composite_words.txt').write_text(text)
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: fit3-face00003-composite-inspection
          path: out
          if-no-files-found: error
          retention-days: 2
