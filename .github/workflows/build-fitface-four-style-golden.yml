name: FitFace Four-Style Golden Layout

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/**'
      - '.github/workflows/build-fitface-four-style-golden.yml'

permissions:
  contents: read

jobs:
  golden-tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Checkout pinned FitFace upstream
        shell: bash
        run: |
          git clone https://github.com/satvikgosai/fitface-studio.git fitface-studio
          git -C fitface-studio checkout 45a9788d3877627fd5301e9ebba36ef6192d7962

      - name: Install Golden semantic inventory test
        shell: bash
        run: |
          cp fitface-layout-golden/Samsung00049SemanticInventoryTest.kt \
            fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/

      - name: RED — fixture absence must trip the inventory assertion
        shell: bash
        run: |
          set +e
          cd fitface-studio
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests dev.fitface.studio.core.format.Samsung00049SemanticInventoryTest \
            > ../inventory-red.log 2>&1
          status=$?
          set -e
          cat ../inventory-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected inventory RED failure but test passed.' >&2
            exit 1
          fi
          result='core/format/build/test-results/testDebugUnitTest/TEST-dev.fitface.studio.core.format.Samsung00049SemanticInventoryTest.xml'
          test -f "$result"
          grep -F 'real Samsung 00049 fixture must be staged by CI' "$result"
          echo 'Inventory RED confirmed.'

      - name: Stage real Samsung 00049 fixture
        shell: bash
        run: |
          mkdir -p fitface-studio/core/format/src/test/resources/fixtures
          python3 fitface-layout-golden/fetch_face00049_fixture.py \
            fitface-studio/core/format/src/test/resources/fixtures/SM-R390_00049_256x402.bin

      - name: GREEN — verify real 00049 semantic inventory
        shell: bash
        run: |
          cd fitface-studio
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests dev.fitface.studio.core.format.Samsung00049SemanticInventoryTest

      - name: Install Pair sequence remap test
        shell: bash
        run: |
          cp fitface-layout-golden/Samsung00049PairSequenceRemapTest.kt \
            fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/

      - name: RED — Pair semantic remap API does not exist yet
        shell: bash
        run: |
          set +e
          cd fitface-studio
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests dev.fitface.studio.core.format.Samsung00049PairSequenceRemapTest \
            > ../pair-remap-red.log 2>&1
          status=$?
          set -e
          cat ../pair-remap-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected Pair remap RED failure but test passed.' >&2
            exit 1
          fi
          grep -F "Unresolved reference 'remapPairSequence'" ../pair-remap-red.log
          if grep -F "Unresolved reference 'readBytes'" ../pair-remap-red.log; then
            echo 'Pair RED is contaminated by a test-helper compile error.' >&2
            exit 1
          fi
          echo 'Pair remap RED confirmed: production API is missing.'

      - name: Apply minimal Golden format patch
        shell: bash
        run: |
          python3 fitface-layout-golden/apply_golden_format_patch.py fitface-studio

      - name: GREEN — Pair remap and inventory regressions
        shell: bash
        run: |
          cd fitface-studio
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests dev.fitface.studio.core.format.Samsung00049SemanticInventoryTest \
            --tests dev.fitface.studio.core.format.Samsung00049PairSequenceRemapTest

      - name: Install Golden seconds compiler test
        shell: bash
        run: |
          cp fitface-layout-golden/Samsung00049SecondsCompilerTest.kt \
            fitface-studio/core/format/src/test/kotlin/dev/fitface/studio/core/format/

      - name: RED — Golden seconds compiler does not exist yet
        shell: bash
        run: |
          set +e
          cd fitface-studio
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests dev.fitface.studio.core.format.Samsung00049SecondsCompilerTest \
            > ../seconds-red.log 2>&1
          status=$?
          set -e
          cat ../seconds-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected seconds compiler RED failure but test passed.' >&2
            exit 1
          fi
          grep -F "Unresolved reference 'GoldenSemanticCompiler'" ../seconds-red.log
          echo 'Golden seconds RED confirmed: compiler is missing.'

      - name: Install Golden seconds compiler
        shell: bash
        run: |
          cp fitface-layout-golden/GoldenSemanticCompiler.kt \
            fitface-studio/core/format/src/main/kotlin/dev/fitface/studio/core/format/

      - name: GREEN — live seconds compiler and regressions
        shell: bash
        run: |
          cd fitface-studio
          ./gradlew --no-daemon :core:format:testDebugUnitTest \
            --tests dev.fitface.studio.core.format.Samsung00049SecondsCompilerTest \
            --tests dev.fitface.studio.core.format.Samsung00049SemanticInventoryTest \
            --tests dev.fitface.studio.core.format.Samsung00049PairSequenceRemapTest
