name: Inspect FitFace 00049 Temp Battery

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/inspect_00049_temp_battery.py'
      - '.github/workflows/inspect-fitface-temp-battery.yml'

permissions:
  contents: read

jobs:
  inspect-temp-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real Samsung 00049 fixture
        shell: bash
        run: python3 fitface-layout-golden/fetch_face00049_fixture.py /tmp/00049.bin
      - name: Print exact temperature and battery records
        shell: bash
        run: python3 fitface-layout-golden/inspect_00049_temp_battery.py /tmp/00049.bin
