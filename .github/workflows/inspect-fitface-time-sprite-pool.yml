name: Inspect FitFace 00049 Time Sprite Pool

on:
  push:
    branches:
      - work/fitface-four-style-golden
    paths:
      - 'fitface-layout-golden/inspect_00049_time_sprite_pool.py'
      - '.github/workflows/inspect-fitface-time-sprite-pool.yml'

permissions:
  contents: read

jobs:
  inspect-time-pool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real Samsung 00049 fixture
        shell: bash
        run: python3 fitface-layout-golden/fetch_face00049_fixture.py /tmp/00049.bin
      - name: Print exact time Sprite sharing
        shell: bash
        run: python3 fitface-layout-golden/inspect_00049_time_sprite_pool.py /tmp/00049.bin
